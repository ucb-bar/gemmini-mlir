      - activated_data_e_scaled_in_to_rec_fn
    dtype: f32
    element_bits: 32
    evidence:
    - observed: 'command-register field(s) carry the ''scale'' role: ConfigExRs1.acc_scale
        (32 bits), ConfigMvinRs1.scale (32 bits), ConfigMvoutRs2.acc_scale (32 bits)'
      rung: register_layout
    - observed: 'io.in.bits.acc_read_resp.scale.bits is decoded as fp32 (sign|exponent|fraction
        at {''sign'': [31, 31], ''exponent'': [30, 23], ''fraction'': [22, 0]})'
      rung: firrtl_structural
    - observed: instance activated_data_e_scaled_muladder (MulAddRecFN_e8_s24_4) takes
        the decoded scale and the accumulator value
      rung: firrtl_structural
    - observed: the scalar readout contract states round-half-to-even and its clamp
      rung: scalar_abi
    format:
      dtype: f32
      fields:
        exponent:
        - 30
        - 23
        fraction:
        - 22
        - 0
        sign:
        - 31
        - 31
      format: fp32
      split_of: _activated_data_e_scaled_WIRE.bits
    output_dtypes:
    - i8
    rounding: half_even
    saturation:
