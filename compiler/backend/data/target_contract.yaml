output_epilogue:
  accumulate:
    evidence:
    - observed: 'accumulate_on_load is derived: a load adds into the accumulator,
        selected per command'
      rung: firrtl_structural
    fact: accumulate_on_load
    status: derived
    value:
      accumulates_on_load: true
      instructions:
        operand_load:
        - LOAD2_CMD
        - LOAD3_CMD
        - LOAD_CMD
      load_path:
        between: the request field enters the load path and the path's output drives
          the bank; the queues in between are crossed by their declared field names,
          not traced per submodule
        carried_by:
        - mvin_scale_pixel_repeater.io.resp.bits.tag.accumulate
        - vsm_1.io.resp.bits.tag.accumulate
        cite:
          firrtl_line: 188800
          module: Scratchpad
          scala_file: generators/gemmini/src/main/scala/gemmini/Scratchpad.scala
          scala_line: 828
        reading: the bank's accumulate bit is the load's address-metadata accumulate
          field
        request: io.dma.read.req.bits.laddr.accumulate
        request_cite:
          firrtl_line: 186138
          module: Scratchpad
          scala_file: generators/gemmini/src/main/scala/gemmini/Scratchpad.scala
          scala_line: 368
        write_select: bank_ios_1[*].write.bits.acc
      roles:
      - operand_load
      selected_per_command: true
      store:
        cite:
          firrtl_line: 184725
          module: AccumulatorMem
          scala_file: generators/gemmini/src/main/scala/gemmini/AccumulatorMem.scala
          scala_line: 183
        reading: the store writes the adder's sum when the write's accumulate bit
          is set
        select: pipelined_writes[*].bits.acc
        sum: io.adder.sum
        write_data: mem.io.wdata
      summary: 'a load (operand_load) can add into the accumulator: the store writes
        the adder''s sum when the write''s accumulate bit is set, and that bit is
        the load address''s own accumulate field'
  accumulator_dtype: i32
  activation:
    before_scale: true
    carriers:
    - bits: 2
      bundle: ConfigExRs1
      field: activation
    - bits: 2
      bundle: ConfigMvoutRs1
      field: activation
    - bits: 1
      bundle: ConfigNormRs1
      field: act_msb
    evidence:
    - observed: 'command-register field(s) carry the ''activation'' role: ConfigExRs1.activation
        (2 bits), ConfigMvoutRs1.activation (2 bits), ConfigNormRs1.act_msb (1 bits)'
      rung: register_layout
    - observed: max(io.in.bits.acc_read_resp.data, 0) is selected when io.in.bits.acc_read_resp.act
        equals [1]; it is applied to the accumulator before the scale
      rung: firrtl_structural
    functions:
      relu:
        applied_to: io.in.bits.acc_read_resp.data
        cite:
          firrtl_line: 180710
          module: AccumulatorScale
          node: activated_data_e_act
          scala_file: src/main/scala/chisel3/util/Mux.scala
          scala_line: 126
        codes:
        - 1
    status: derived
    unrecognized_codes: []
  bias_preload:
    bits: 32
    dtype: i32
    evidence:
    - observed: 'a load writes the accumulator when its accumulate bit is clear, and
        vsm_1 (VectorScalarMultiplier_1) copies 16 32-bit lanes of in.bits.in with
        no arithmetic: a full-width value is preloaded exactly'
      rung: firrtl_structural
    lanes:
      bits: 32
      firrtl_line: 159007
      lanes: 16
      module: VectorScalarMultiplier_1
      store_writes: pipelined_writes[1].bits.data
      through: vsm_1
      vector: in.bits.in
    range:
    - -2147483648
    - 2147483647
    rounding: none
    status: derived
  firrtl:
    fir_path: /work/merlin/tasks/phase1-harness-v2/merlin/out/artifacts/probes/gemmini/fire-aligned-30mhz/firesim-target/elaboration/firechip.chip.FireSim.FireSimGemminiRocketConfig.fir
