      rung: firrtl_build_gate
    reductions:
    - max
    status: derived
  scale:
    accumulator_dtype: i32
    carriers:
    - bits: 32
      bundle: ConfigExRs1
      field: acc_scale
    - bits: 32
      bundle: ConfigMvinRs1
