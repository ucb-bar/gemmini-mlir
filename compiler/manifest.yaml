artifact_type: mlir_oot_target_backend
target: gemmini
language: python
authoring:
  mode: hand_curated
  author: Codex
integrity_exempt: false
entrypoints:
  tool: compiler.py
commands:
  parse:
    argv: [python3, '{tool}', --verify-diagnostics, '{input_mlir}']
  lower_interface_to_target:
    argv: [python3, '{tool}', --convert-iface-to-gemmini, '{input_mlir}']
  emit_command_buffer:
    argv: [python3, '{tool}', --convert-iface-to-gemmini, '--emit-command-buffer={output_json}', '{input_mlir}']
  lower_target_to_llvm:
    argv: [python3, '{tool}', --convert-gemmini-to-llvm, '{input_mlir}']
  emit_analysis_bundle:
    argv: [python3, '{tool}', --convert-iface-to-gemmini, '--emit-command-buffer={output_json}', --emit-target-artifact, '{input_mlir}']
