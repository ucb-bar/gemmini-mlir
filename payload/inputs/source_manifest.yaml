# source_manifest.yaml — provenance of every fact used to generate this package, and (critically)
# whether each fact is PUBLIC target information (also available to the raw baseline) or a Merlin
# TOOLING-ADVANTAGE (pre-assembled by Merlin tooling). Fairness rule (Correction B): any encoding
# fact in the `tooling_advantage` bucket is reported as a tooling advantage in REPORT.md, never
# silently treated as parity information.
schema: source_manifest/0.1
package: agent_spec_v0_mlir_oot

toolchain:
  merlin_sha: 2a8500441f6739677b7f731ea2f881fe3228a2ab
  llvm:
    version: 23.0.0git
    commit: a47bddccec30
    install: third_party/llvm-install            # mlir-opt/mlir-tblgen/mlir-translate + lib/cmake/mlir
  clang: 23.0.0git                                 # /scratch2/agustin/merlin/build/host-merlin-release/install/bin/clang-23
  riscv_gcc: "riscv64-unknown-elf-gcc (gc891d8dc23e) 13.2.0"   # $MERLIN_CHIPYARD/.conda-env/riscv-tools/bin
  spike: "Spike RISC-V ISA Simulator 1.1.1-dev (--extension=gemmini)"
  verilator: "Verilator 5.022 2024-02-24"

# ---- PUBLIC target information (in the sandbox / contract / public Gemmini headers) ----
# These are the same facts the raw baseline receives. Confirmed by grep of the cited files.
public_facts:
  - fact: "Gemmini RoCC uses custom-3 opcode (0x7b)"
    source: "gemmini_params.h:7 (XCUSTOM_ACC 3); RISC-V .insn custom-3 == 0x7b"
  - fact: "systolic array DIM = 16 (single 16x16 tile)"
    source: "gemmini_params.h:8 (#define DIM 16)"
  - fact: "funct codes: config=0, mvin=2, mvout=3, compute_preloaded=4, compute_accumulated=5, preload=6, flush=7"
    source: "gemmini.h:158-166 (config_funct..flush_funct const members)"
  - fact: "acc_scale is an IEEE-754 binary32 multiply applied at i8 readout, then saturating clamp"
    source: "gemmini_params.h:38,68,76-78 (ACC_SCALE macro; ACC_SCALE_T_IS_FLOAT; EXP_BITS 8 / SIG_BITS 24)"
  - fact: "weight-stationary dataflow; preload weights then compute against streamed activations"
    source: "gemmini.h:128-130 (preload/compute) + Gemmini ISA docs"
  - fact: "command-buffer ABI opcodes RES_PACK/MATMUL_RESIDENT/COMMIT/EVICT + epilogue/output_dtype/acc_scale"
    source: "bench_contract/command_buffer_abi.yaml (public contract)"
  - fact: "interface grammar (merlin_iface) ops/types + the 4 package entrypoints + gemmini_kernel ABI"
    source: "bench_contract/interface_grammar.md, mlir_oot_backend_contract.yaml (public contract)"

# ---- Merlin TOOLING-ADVANTAGE (pre-assembled; derivable from public facts but handed over ready) ----
# Ported into self-contained C++ in lib/Conversion/GemminiToLLVM (no runtime Merlin import).
tooling_advantage:
  reported_as: "Merlin tooling advantage (see REPORT.md). The baseline must assemble these from the public funct codes + ACC_SCALE semantics itself."
  facts:
    - fact: "exact config-word RS1/RS2 bit-packing: CFG_EX_RS1=(F1<<32)|(1<<16)|(1<<2), CFG_EX_RS2=(1<<48), CFG_LD_RS1=(F1<<32)|(DIM<<16)|(1<<8)|1, CFG_ST RS1=(acc_act<<2)|2, RS2=(scale_bits<<32)|(out_row_stride_bytes)"
      source: "merlin/python/merlin/runtime/backends/gemmini_codegen_mlir.py:33-35,170"
    - fact: "tile descriptor _pack(addr) = (DIM<<48)|(DIM<<32)|(addr & 0xFFFFFFFF)"
      source: "gemmini_codegen_mlir.py:41-42"
    - fact: "accumulator address bits: C_ACC=0xA0000000 (full-i32 readout), ACC_I8=0x80000000 (scaled i8 readout), ACC_ACCUM=0x40000000 (K-accumulate onto)"
      source: "gemmini_codegen_mlir.py:27-28,38"
    - fact: "resident-weight mvin ordering + dual config_ld strides (np_ for W, kp for A); i8 readout drops full_C so acc_scale applies"
      source: "gemmini_codegen_mlir.py:150-180"

adapted_from:
  - "generated_targets/gemmini/hand_smoke_oot (CMake/ODS build wiring + g0/g1 i32 RoCC sequence; used as an interface-understanding exemplar, not copied as the result)"
  - "merlin/python/merlin/targetgen/synthesize/{target_contract,dialect_plan,runtime_adapter_plan}.py (schema/shape of the spec & plan YAMLs)"
  - "merlin/python/merlin/xdsl_dialects/interface.py (xDSL IRDL patterns for the prototype plane)"
