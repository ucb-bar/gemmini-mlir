name: gemmini
version: 0.1
family: tensor_resident
endpoint_kind: inline_asm_insn
rtl_extraction:
  firrtl_role_probe:
    array:
      name: mesh
      parent_module_contains: Mesh
      child_module_prefix: Tile
    memory:
      name: scratchpad
      declaration_contains: 'smem mem : UInt<'
      source_contains: Scratchpad.scala
      datapath_name: input
    interfaces:
    - module: ReservationStation
      name: rocc_cmd
      evidence: module ReservationStation (RoCC decode/dispatch)
    - module: FrontendTLB
      name: dma_tlb
      evidence: module FrontendTLB
  scala_funct_block:
    start_comment: // funct values
    stop_declaration: CONFIG_EX
  accumulator_memory:
    module: AccumulatorMem
    memory_name: accumulator
    address_port: io_write_bits_addr
    data_prefix: io_write_bits_data_
    data_suffix: _0
    mask_prefix: io_write_bits_mask_
    firrtl_data_field: io.write.bits.data
  boolean_feature_gate:
    feature: max_pool
    module: StoreController
    node: pooling_is_enabled
    dynamic_operand_contains: pool
    config_field: has_max_pool
  timing_structure:
    dispatch:
      module: ReservationStation
      classes:
        load: io_issue_ld_
        store: io_issue_st_
        execute: io_issue_ex_
    memory_protocol:
      request: a_bits_
      response: d_bits_
      id: source
      data: data
      size: size
      size_encoding: log2_bytes
    memory_clients:
      dma_read:
        module: StreamReader
        port_prefix: auto_core_out_
      dma_write:
        module: StreamWriter
        port_prefix: auto_out_
    dataflow:
      cell_module: PE_256
      select_port: io_in_control_dataflow
    latencies:
      scratchpad_bank_read:
        module: ScratchpadBank
        from: io_read_req_bits_addr
        to: io_read_resp_bits_data
      scratchpad_read:
        module: Scratchpad
        from: io_srams_read_0_req_bits_addr
        to: io_srams_read_0_resp_bits_data
      accumulator_bank_read:
        module: AccumulatorMem
        from: io_read_req_bits_addr
        to: io_read_resp_bits_data_0_0
      accumulator_read:
        module: Scratchpad
        from: io_acc_read_req_0_bits_addr
        to: io_acc_read_resp_0_bits_data_0_0
      accumulator_adder:
        module: AccPipe
        from: io_op1
        to: io_sum
      mesh_with_delays_ws:
        module: MeshWithDelays
        from: io_a_bits_0_0
        to: io_resp_bits_data_0_0
        mode: weight_stationary
    array_paths:
      mesh_activation_to_partial_sum_ws:
        module: Mesh
        from_prefix: io_in_a_
        to_prefix: io_out_b_
        mode: weight_stationary
    profile_resources:
      accelerator.load:
        capacity:
          buffer_instance: Gemmini/load_controller/cmd_tracker
        queue_capacity:
          from: command_classes.classes.load.entries.value
          minus:
            buffer_instance: Gemmini/load_controller/cmd_tracker
        basis: 'capacity: load commands started and not completed (DMA command-tracker
          slots); queue_capacity: load dispatch entries not in service (entries are
          held until completion)'
      accelerator.store:
        capacity:
          buffer_instance: Gemmini/store_controller/cmd_tracker
        queue_capacity:
          from: command_classes.classes.store.entries.value
          minus:
            buffer_instance: Gemmini/store_controller/cmd_tracker
        basis: 'capacity: store commands started and not completed (DMA command-tracker
          slots); queue_capacity: store dispatch entries not in service'
      accelerator.execute:
        capacity: null
        queue_capacity: null
        basis: the execute path overlaps preload/compute pairs through the mesh pipeline;
          no structural in-flight bound maps onto engine lanes (dispatch entries and
          command buffers are recorded)
      accelerator.config:
        capacity: null
        queue_capacity: null
        basis: configuration commands occupy the dispatch class of the unit they configure
      accelerator.dma_read:
        capacity: memory_clients.clients.dma_read.request_channels
        queue_capacity: null
        basis: one request channel issues one beat per cycle; in-flight transactions
          bound latency hiding and are fitted together with read_bytes_per_cycle,
          not a lane count
      accelerator.dma_write:
        capacity: memory_clients.clients.dma_write.request_channels
        queue_capacity: null
        basis: one request channel; in-flight transactions are fitted with write_bytes_per_cycle
runner:
  suite: gemmini-capsule-bench
  dtype: i8xi8_i32
  tier_sim:
    L2: spike
    L3: elaborated_rtl
    L4: firesim
  sim_via: chipyard
  toolchain:
    root_env: MERLIN_CHIPYARD
    root_ext: chipyard
    compiler:
      path: .conda-env/riscv-tools/bin/riscv64-unknown-elf-gcc
      env: MERLIN_RISCV_GCC
    spike:
      path: .conda-env/riscv-tools/bin/spike
    spike_library_dir: .conda-env/riscv-tools/lib
    spike_extension_name: gemmini
    verilator:
      path: sims/verilator/simulator-chipyard.harness-{rtl_sim_config}
    gsim_max_cycles: 20000000
encoding:
  addr_len: 32
  rocc_custom_slot: 3
  semantic_class:
    0: CONFIG
    1: MVIN2
    2: MVIN
    3: MVOUT
    4: COMPUTE_PRELOADED
    5: COMPUTE_ACCUMULATE
    6: PRELOAD
    7: FLUSH
    8: LOOP_WS
    14: MVIN3
    15: LOOP_CONV
  config_subtype:
    0: CONFIG_EX
    1: CONFIG_LD
    2: CONFIG_ST
  corpus_issue_order:
  - FLUSH
  - CONFIG_EX
  - CONFIG_LD
  - MVIN
  - CONFIG_ST
  - PRELOAD
  - COMPUTE_PRELOADED
  - MVOUT
  class_subsumes:
    LOOP_CONV:
    - MVIN
    - PRELOAD
    - COMPUTE_PRELOADED
    - MVOUT
    LOOP_WS:
    - MVIN
    - PRELOAD
    - COMPUTE_PRELOADED
    - MVOUT
rocc_operand_roles:
  local_address_flags:
    accumulator_select:
      msb_offset: 0
    accumulate:
      msb_offset: 1
    full_width_readout:
      msb_offset: 2
  isa_constants:
    F1:
      f32_bits: 1.0
    C_ACC:
      flags:
      - accumulator_select
      - full_width_readout
    ACC_I8:
      flags:
      - accumulator_select
    ACC_ACCUM:
      flags:
      - accumulate
    FULL_C_BIT:
      flags:
      - full_width_readout
  readout_bits:
    f1: F1
    c_acc: C_ACC
    acc_i8: ACC_I8
    acc_accum: ACC_ACCUM
    full_c_bit: FULL_C_BIT
  retain_sentinel:
    bundle: ComputeRs
    field: local_addr
    value: all_ones
  config:
    class: CONFIG
    selector:
      operand: rs1
      bundle: ConfigMvoutRs1
      field: cmd_type
    publish_layouts:
      CONFIG_ST_LAYOUT: ConfigMvoutRs1
  classes:
    MVIN: &id001
      fields:
      - name: is_acc_addr
        operand: rs2
        bundle: MvinRs2
        field: local_addr
        as: flag
        flag: accumulator_select
      - name: dram
        operand: rs1
        as: operand
      - name: rows
        operand: rs2
        bundle: MvinRs2
        field: num_rows
      - name: cols
        operand: rs2
        bundle: MvinRs2
        field: num_cols
      - name: addr
        operand: rs2
        bundle: MvinRs2
        field: local_addr
      - name: spad_addr
        operand: rs2
        bundle: MvinRs2
        field: local_addr
    MVIN2: *id001
    MVIN3: *id001
    MVOUT:
      fields:
      - name: dram
        operand: rs1
        as: operand
      - name: rows
        operand: rs2
        bundle: MvoutRs2
        field: num_rows
      - name: cols
        operand: rs2
        bundle: MvoutRs2
        field: num_cols
      - name: addr
        operand: rs2
        bundle: MvoutRs2
        field: local_addr
      - name: acc_addr
        operand: rs2
        bundle: MvoutRs2
        field: local_addr
      - name: readout
        operand: rs2
        bundle: MvoutRs2
        field: local_addr
        as: flag_choice
        flag: full_width_readout
        set: i32
        clear: i8
    PRELOAD:
      fields:
      - name: weight_spad
        operand: rs1
        bundle: PreloadRs
        field: local_addr
      - name: c_addr
        operand: rs2
        bundle: PreloadRs
        field: local_addr
      - name: accumulate
        operand: rs2
        bundle: PreloadRs
        field: local_addr
        as: flag
        flag: accumulate
      - name: readout
        operand: rs2
        bundle: PreloadRs
        field: local_addr
        as: flag_choice
        flag: full_width_readout
        set: i32
        clear: i8
    COMPUTE_PRELOADED: &id002
      fields:
      - name: a_spad
        operand: rs1
        bundle: ComputeRs
        field: local_addr
      - name: bd
        operand: rs2
        bundle: ComputeRs
        field: local_addr
      - name: garbage
        operand: rs2
        bundle: ComputeRs
        field: local_addr
        as: all_ones
    COMPUTE_ACCUMULATE: *id002
    CONFIG_EX:
      fields:
      - name: subtype
        const: EX
    CONFIG_LD:
      unresolved: 'null'
      fields:
      - name: subtype
        const: LD
      - name: stride
        operand: rs2
        as: raw
      - name: scale
        operand: rs1
        bundle: ConfigMvinRs1
        field: scale
        as: f32
      - name: scale_bits
        operand: rs1
        bundle: ConfigMvinRs1
        field: scale
    CONFIG_ST:
      unresolved: 'null'
      fields:
      - name: subtype
        const: ST
      - name: acc_act
        operand: rs1
        bundle: ConfigMvoutRs1
        field: activation
      - name: relu
        from: acc_act
        equals: 1
      - name: acc_scale
        operand: rs2
        bundle: ConfigMvoutRs2
        field: acc_scale
        as: f32
      - name: acc_scale_bits
        operand: rs2
        bundle: ConfigMvoutRs2
        field: acc_scale
      - name: out_stride_bytes
        operand: rs2
        bundle: ConfigMvoutRs2
        field: stride
      - operand: rs1
        bundle: ConfigMvoutRs1
        names:
        - pool_stride
        - pool_size
        - pool_out_dim
        - porows
        - pocols
        - orows
        - ocols
        - upad
        - lpad
rtl_checks:
  class_roles:
    FENCE:
    - fence
    CONFIG_EX:
    - config_compute
    CONFIG_LD:
    - config_load
    CONFIG_ST:
    - config_store
    MVIN:
    - movement_in
    MVIN2:
    - movement_in
    MVIN3:
    - movement_in
    MVOUT:
    - movement_out
    PRELOAD:
    - preload
    COMPUTE_PRELOADED:
    - compute
    - compute_preloaded
    COMPUTE_ACCUMULATE:
    - compute
  role_labels:
    fence: FENCE
    config_compute: CONFIG_EX
    config_load: CONFIG_LD
    config_store: CONFIG_ST
    movement_in: MVIN
    movement_out: MVOUT
    preload: PRELOAD
    compute: COMPUTE
    compute_preloaded: COMPUTE_PRELOADED
  fields:
    dram: dram
    rows: rows
    cols: cols
    store_pitch: out_stride_bytes
  local_addresses:
  - role: movement_in
    address: spad_addr
    rows: rows
  - role: movement_out
    address: acc_addr
    rows: rows
  - role: preload
    address: weight_spad
  - role: preload
    address: c_addr
  - role: compute
    address: a_spad
  - role: compute
    address: bd
  native_pooling:
    config_role: config_store
    feature: max_pool
    enable_field: pool_stride
    output_positions:
    - porows
    - pocols
  rules:
  - id: T0.decode_clean
    rule: decode_clean
  - id: T0.decode_funct_legal
    rule: funct_legal
  - id: T0.local_address_bounds
    rule: local_address_bounds
  - id: T0.preload_before_compute
    rule: precedes
    first: preload
    then: compute_preloaded
  - id: T0.config_before_use
    rule: config_before_use
    pairs:
    - use: compute
      config: config_compute
    - use: movement_in
      config: config_load
    - use: movement_out
      config: config_store
  - id: T0.fence_bracket
    rule: bracket
    role: fence
  - id: T0.output_store_coverage
    rule: output_store_coverage
