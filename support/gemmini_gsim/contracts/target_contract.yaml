capabilities: {}
measurement:
  cycles_from: spike
  wall_from: k1
  cycles_tier: functional
  wall_tier: silicon
  speed_of_light: mesh_macs_per_cycle
  citable_tier: rtl
  notes:
  - k1 also carries a `cycles` field, but it is an rdtime-derived ESTIMATE, not authoritative.
    Picking cycles by field name rather than by authority gets that estimate.
memory_model:
  resident: true
  accumulators: true
  dma:
    max_transfer_bytes: 64
  hazard_resolution: explicit
  hazard_evidence:
    kind: target_rtl
    sources:
    - 'elaborated design hierarchy: rockettile.gemmini.reservation_station (io_busy)'
    - 'derived semantic fact load_completion_ordering: a load waits for an earlier
      load only until it issues (ReservationStation.scala:329)'
    - 'ReservationStation.scala:242-252: a pooling store is given an accumulator-bank
      range; entries hold local addresses only, no DRAM address'
    note: 'The reservation station orders most local-address dependencies between
      its load, execute and store queues, but not an overlapping load after a load,
      a scratchpad-source pooling store, or a DRAM read after a write. Reordering
      a legal command stream CAN change the answer: five tests passed on Spike and
      failed on RTL until a fence was added, and FireSim job 2835 failed layer_norm
      for the same reason. The fences are listed under compiler_obligations.'
prototype_scope:
  workload: repeated_rhs_matmul
  conformance_level: C0
  epilogue: none
  output_dtype: i32
oracle_ladder:
  level_0:
    name: merlin_reference_and_command_buffer_sim
    derived_from_rtl: false
  level_1:
    name: spike_gemmini_functional
    derived_from_rtl: false
  level_2:
    name: gemmini_verilator_rtl
    derived_from_rtl: true
  level_3:
    name: firesim
    derived_from_rtl: true
oracle_blind_spots:
- id: accumulator_base_rotation
  tiers:
  - L2
  engine: spike_gemmini_functional
  axes:
  - - instruction_class
    - LOOP_WS
  - - instruction_class
    - LOOP_CONV
  what: After every loop command issued with a non-zero output address the RTL rotates
    the accumulator base by the accumulator depth over the number of concurrent loops.
    The functional model pins the base at row zero, so a program that reads the accumulator
    across two loop commands sees different rows on the two engines.
  evidence: 'One executable, unchanged: the functional tier reported 0 of 1000 outputs
    wrong and the FPGA reported 1000 of 1000 wrong, with a different top-1 class.'
  reproducer: Two back-to-back loop commands that write through the accumulator with
    an output address set, the second reading what the first accumulated.
- id: residual_operand_store_state
  tiers:
  - L0
  - L1
  engine: merlin_reference_and_command_buffer_sim
  axes:
  - - mode
    - padded_edge
  what: The command-buffer simulator models tensors and has no operand store. A program
    whose result depends on what the store held at entry (the out-of-bounds taps of
    a padded convolution that the program never wrote) is judged there as if the store
    were zero.
  evidence: 'One padded 3x3 convolution run after a command that left non-zero rows
    in the store: the instruction-level functional tier differs from the declared
    convolution in 8 of 27 elements, and the command-buffer tiers report no difference.'
  reproducer: Move a non-zero tensor into the operand-store rows a padded convolution
    gathers from, then run the convolution.
compiler_obligations:
- must_prove_rhs_immutable_for_residency
- must_tile_to_mesh_shape
- must_commit_accumulator_before_reuse
- must_respect_scratchpad_capacity
- must_fence_overlapping_load_after_load
- must_fence_dram_read_after_write
- must_fence_before_scratchpad_source_pooling_store
- must_not_read_ex_operands_from_accumulator
- must_not_emit_config_norm
- must_not_emit_mvout_spad
- must_zero_fill_accumulator_through_unshrunk_load_state
- must_bound_each_mesh_pass_to_mac_result_bits
- must_not_negate_int8_minimum_on_load
- must_not_pair_readout_relu_with_negative_scale
- must_prescale_int32_accumulator_seeds
hardware_promises:
- weight_stationary_resident_array
- widening_integer_accumulate
- cycle_counter
runtime_promises:
- command_buffer
- metrics
certification:
  status: uncertified
confidence: medium
requires_human_review: true
notes: 'Hand-curated prototype contract for the Gemmini C0 RTL-certification path.
  Mesh geometry, scratchpad/ accumulator capacities and datapath dtypes are CIRCT-extracted
  facts (not declared here); consumers read them from the fact bundle. Spike-Gemmini
  is a functional bootstrap model (derived_from_rtl: false); only Verilator/FireSim
  count as RTL-certified.'
harness_abi:
  entry_symbol: gemmini_kernel
  fence_symbol: GEMMINI_FENCE
  includes:
  - <stdint.h>
  - <stdio.h>
  - <stdlib.h>
  - gemmini_isa.h
  cycle_window_metric: cycle_window_gemmini_region
hardware_pins:
- gemmini_rtl
unmaterializable_families:
  elementwise_map: 'no probe path today: an elementwise capsule is authored through
    the PyTorch/linalg source with a host-eager golden (needs the m2m venv, so not
    a deterministic offline probe), and capsule_golden._recompute_golden has no elementwise
    op, so it cannot be graded at all on an exact-integer datapath. Needs a merlin_iface
    elementwise mnemonic + a recompute entry.'
execution_capabilities:
  whole_program_kernel_abi: render_harness accepts kernel_abi.kind=whole_program and
    calls declared tensor arguments without performing model arithmetic in the runner-owned
    harness
  warm_single_counter_region_cycles: the whole-program harness executes one unmeasured
    warm invocation, then brackets exactly one complete kernel invocation with the
    target cycle counter
readout_semantics:
  evidence_header:
    file: include/gemmini_params.h
    sha256: 3758ae967af3a179497660970201093a7fb624be00173990ce33d3f5c38da924
  epilogue_capability:
  - selector: i8
    applies:
    - acc_scale
    - relu
    - maxpool
    evidence: the narrowing readout applies accumulator scale and activation; bias
      is loaded into the accumulator before computation, not added during readout
      (GemminiRocketConfig AccumulatorScale and LoopMatmulLdD/LoopConvLdBias); RTL-certified
      bit-exact against Tensor.requant_acc_scale (decision A)
  - selector: i32
    applies: []
    evidence: the full-width readout writes the raw accumulator without applying an
      epilogue stage (RoCC accumulator mvout path); any contraction bias already in
      the accumulator was loaded before computation, via the separate accumulator_seed
      route
  stage_routes:
  - stages:
    - bias_add
    - bias
    site: accumulator_seed
    composed_with: contraction
    readouts:
    - i8
    - i32
    producer_opcodes:
    - MATMUL_RESIDENT
    - CONV2D
    consumer_opcodes:
    - COMMIT
    - CONV2D
    operand_attribute: bias
    operand_role: bias
    evidence: Selected GemminiRocketConfig FIRRTL LoopMatmulLdD and LoopConvLdBias
      write bias into AccumulatorMem with accumulate=0; AccumulatorScale has no bias
      operand.
  scalar_abi:
    schema: scalar_narrow_readout_contract_v1
    accumulator_dtype: i32
    output_dtype: i8
    scale_dtype: f32
    clamp_min: -128
    clamp_max: 127
  operand_sum:
    schema: operand_sum_contract_v1
    operands: 2
    operand_dtype: i8
    scale_dtype: f32
    operand_rounding: half_even
    operand_saturates: true
counter_semantics:
  engine_kinds:
    EX: compute
    LD: movement
    ST: movement
  partition:
    module: Gemmini
    counter_module: CounterController
