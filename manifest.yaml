optimization_surfaces:
- id: golden_calibrated_model_catalog
  scope: codegen
  path: mlir_oot/golden_calibrated_catalog.py
  symbol: compile_calibrated_catalog
  effects: [tiling, movement, residency, latency_hiding]
  cca_axes: [compute.register_block, dispatch.dma_overlap, memory.capacity_fit]
  mechanism: Bind explicit prepared-source calibrations to the ordinary model catalog and invoke the existing shared selector for each covered contraction.
  emitted_delta: Replaces the actual selected object and source-call symbol while retaining every required unselected implementation in the linked catalog.
  validation: Require exact source and operation bindings, selected receipt/object pins, complete default coverage, unique symbols and final executable closure with original numeric gates.
  abandonment: Refuse stale or incomplete calibration; keep whole-graph costs, alias analysis and shared whole-model selection unknown rather than summing capsule measurements.
- id: golden_calibrated_source_selection
  scope: heuristic
  path: mlir_oot/golden_calibrated_plan.py
  symbol: optimize_contraction
  effects: [tiling, movement, residency, latency_hiding]
  cca_axes: [compute.register_block, dispatch.dma_overlap, memory.capacity_fit]
  mechanism: Bind legal same-source compiler alternatives to exact measured fixture prices and invoke Merlin's existing exact-cover search.
  emitted_delta: Compiles the selected actual target implementation and requires its calibrated object identity.
  validation: Preserve source, fixture, compiler and engine pins; refuse unpriced, duplicate, changed or incomplete alternatives and validate the emitted object.
  abandonment: Refuse incompatible calibration; keep physical floor, internal engine occupancy and whole-model costs unknown until independently established.
- id: golden_dense_shape
  scope: heuristic
  path: mlir_oot/golden_contraction_upstream.py
  symbol: choose_shape
  effects: [tiling, movement, residency]
  cca_axes: [compute.register_block, memory.capacity_fit]
  mechanism: Select resource-legal blocking and input reuse from the matched integer contraction shape.
  emitted_delta: Changes primitive panel loads, repeated operand transfers and M/N blocking in the exported object.
  validation: Preserve the source dimensions and numeric contract; independently qualify tails and actual emitted objects.
  abandonment: Refuse an illegal candidate and retain the prior resource-legal schedule; command estimates are not cycle evidence.
- id: golden_dense_transfer_family
  scope: heuristic
  path: mlir_oot/dense_schedule.py
  symbol: select_kernel
  effects: [tiling, movement, residency, issue, latency_hiding]
  cca_axes: [compute.accumulator_resident, dispatch.dma_overlap, memory.capacity_fit]
  mechanism: Select explicit legal transfer and residency families using primitive command and requested-byte costs.
  emitted_delta: Changes A/B load order, bank placement, output blocking and generated prefetch commands.
  validation: Require resource proofs, identical arithmetic and source binding, complete numeric checks and paired hardware measurements.
  abandonment: Retain the control on resource refusal or rejected cost policy; fewer commands do not establish lower latency.
- id: golden_remaining_b_slots
  scope: heuristic
  path: mlir_oot/b_slot_placement.py
  symbol: select_remaining_b_slots
  effects: [memory_planning, residency, latency_hiding, issue]
  cca_axes: [dispatch.double_buffered_banks, memory.capacity_fit]
  mechanism: Prove two complete disjoint B slots outside the live cached A extent using target bank resources.
  emitted_delta: Changes next-K B slot addresses and primitive load/preload ordering while preserving contraction order.
  validation: Check full reserved extents, bank boundaries, tails, exact source-order command traces and hardware performance.
  abandonment: Retain default placement whenever complete slot disjointness or schedule prerequisites cannot be proved.
- id: golden_dense_output_schedule
  scope: codegen
  path: mlir_oot/golden_gemm.py
  symbol: GoldenGemm._output_block
  effects: [tiling, residency, issue, latency_hiding]
  cca_axes: [compute.register_block, compute.accumulator_resident, dispatch.dma_overlap]
  mechanism: Emit the selected primitive contraction loop and explicit next-K prefetch lifetime.
  emitted_delta: Changes executable load, preload, compute and output-store order in the generated target module.
  validation: Preserve source K order, rounding and saturation; compare executed command traces, full output checks and final ELF no-FSM audits.
  abandonment: Reject an unprovable lifetime or semantic change; never promote an instruction-count-only performance claim.
- id: golden_conv_schedule
  scope: heuristic
  path: mlir_oot/conv_schedule.py
  symbol: select_kernel
  effects: [layout, tiling, movement, residency]
  cca_axes: [memory.capacity_fit, memory.onchip_resident, layout.operand_major]
  mechanism: Choose convolution transfer families from proven source geometry and bounded target scratchpad resources.
  emitted_delta: Changes spatial stripe width, input residency and primitive convolution operand transfers.
  validation: Retain exact source padding and K order; qualify independent spatial/channel tails and full original-model accuracy.
  abandonment: Refuse unsupported geometry or resource placement and preserve the existing legal convolution family.
- id: golden_conv_resident_stripe
  scope: codegen
  path: mlir_oot/golden_resident_stripe_conv.py
  symbol: GoldenResidentStripeConv.build
  effects: [layout, tiling, movement, residency, issue]
  cca_axes: [compute.accumulator_resident, memory.onchip_resident, memory.capacity_fit]
  mechanism: Lower a resource-proven resident convolution stripe to explicit target primitive commands.
  emitted_delta: Reuses resident input stripes across bounded accumulator/output groups and changes real operand load traffic.
  validation: Check complete scratchpad intervals, exact padded source contraction, all outputs/guards, strict execution and final no-FSM audit.
  abandonment: Decline a stripe without exact padding, bounds or arithmetic preservation; keep negative timing evidence.

- id: golden_dense_resident_accumulator_admission
  scope: heuristic
  path: mlir_oot/resident_accumulator_policy.py
  symbol: select_resident_accumulator_stripes
  effects: [tiling, movement, residency]
  cca_axes: [compute.accumulator_resident, memory.capacity_fit]
  mechanism: Admit an explicitly requested dense stripe family from existing cached A, narrow stores, complete scratchpad bank extents and accumulator bounds.
  emitted_delta: Replaces the actual generated kernel with full-A, full-reduction-B and bounded wide output stripes; original source numeric proof and public ABI remain bound.
  validation: Require default object identity, complete source K order, independent i8/i32 tails, exact original full-model gates and final zero-FSM audit.
  abandonment: Preserve the existing generator on typed layout/resource refusal; explicit admission is not inferred profitability or a shared-solver decision.
- id: golden_dense_resident_accumulator_emission
  scope: codegen
  path: mlir_oot/golden_resident_stripe_gemm.py
  symbol: GoldenResidentStripeGemm.build
  effects: [tiling, movement, residency, issue]
  cca_axes: [compute.accumulator_resident, memory.onchip_resident, memory.capacity_fit]
  mechanism: Emit complete input planes and full-K current-channel weights across accumulator-bounded M stripes using primitive instructions.
  emitted_delta: Changes actual load widths/counts, live storage placement and output store grouping while retaining increasing reduction order.
  validation: Check all declared reserved extents, emitted and executed primitive multiplicities, exact source outputs, guards and immutable inputs on matched complete capsules.
  abandonment: Refuse invalid storage or nonzero seed; retain independent negative schedules and never transfer capsule gains to whole-model costs.
- id: golden_dense_cached_b_capacity_admission
  scope: heuristic
  path: mlir_oot/dense_schedule.py
  symbol: choose_capacity_cached_b
  effects: [tiling, movement, residency, issue]
  cca_axes: [compute.accumulator_resident, memory.onchip_resident, memory.capacity_fit]
  mechanism: Admit explicitly requested complete-K/N B residency beyond the legacy static tile budget using actual placed scratchpad and accumulator intervals.
  emitted_delta: The normal capture compiler selects the complete-weight kernel, coalesced disjoint A slots when aligned, and exact single-panel A for K tails; source arithmetic remains unchanged.
  validation: Require default object identity, decoded tensor cell/source-K/lifetime proof, complete matched original and independent tail capsules, original whole-model gate and final zero-FSM audit.
  abandonment: Preserve cached input/weights or refuse incompatible dense/bias/view/resource facts; admission and command counts do not establish timing profitability.
- id: golden_resident_weight_packet_issue
  scope: heuristic
  path: mlir_oot/golden_resident_conv.py
  symbol: issue_resident_weight_packets
  effects: [movement, residency, issue]
  cca_axes: [memory.onchip_resident, memory.capacity_fit, compute.accumulator_resident]
  mechanism: Explicitly issue smaller next weight packets into alternate scratchpad banks while retaining the same complete input and output panel.
  emitted_delta: The normal capture command selects bounded ordinary K/spatial loops and packet DMA/compute interleaving without changing any output's source K order or numeric fields.
  validation: Decode actual emitted source cells and lifetimes, close all outputs/guards/inputs on matched original and independent tail capsules, retain default object identity and original full model gate.
  abandonment: Refuse incompatible family or placement; retain negative small-shape evidence and unknown timing until the current source-qualified scope is measured.
