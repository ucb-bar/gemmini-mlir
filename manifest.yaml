artifact_type: mlir_oot_target_backend
authoring:
  author: human
  generated_by_agent: false
  generated_from_rtl_facts: false
  mode: hand_curated
build:
  command:
  - cmake
  - --build
  - '{package}/build'
  configure:
  - cmake
  - -S
  - '{package}'
  - -B
  - '{package}/build'
  - -DCMAKE_BUILD_TYPE=Release
  tool_output: build/bin/gemmini-opt
commands:
  emit_command_buffer:
    argv:
    - '{tool}'
    - --convert-iface-to-gemmini
    - --emit-command-buffer={output_json}
    - '{input_mlir}'
  lower_interface_to_target:
    argv:
    - '{tool}'
    - --convert-iface-to-gemmini
    - '{input_mlir}'
  lower_target_to_llvm:
    argv:
    - '{tool}'
    - --convert-gemmini-to-llvm
    - '{input_mlir}'
  parse:
    argv:
    - '{tool}'
    - --verify-diagnostics
    - '{input_mlir}'
entrypoints:
  tool: build/bin/gemmini-opt
family: tensor_resident
integrity_exempt: false
language: cpp
layout_version: '1.0'
package_id: hand_v0
target: gemmini
